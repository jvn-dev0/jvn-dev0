# ======================================================================
# GITHUB CONTRIBUTION SNAKE ANIMATION WORKFLOW
# Repository: jvn-dev0/jvn-dev0
# Purpose: Automatically generates an animated contribution graph snake
#          matching the custom pink aesthetic palette and commits to 'output'
# ======================================================================

name: Generate Contribution Snake

on:
  # Automatically execute once every 24 hours at midnight UTC
  schedule:
    - cron: "0 0 * * *"

  # Allows manual triggering from the GitHub Actions tab anytime
  workflow_dispatch:

  # Runs on every push to the main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Contribution Grid Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF69B4&color_dots=#2B1A24,#EF93C4,#FF69B4,#FF1493,#FF69B4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Snake SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
